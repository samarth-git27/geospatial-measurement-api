[project]
name = "geospatial-measurement-api"
version = "1.0.0"
description = "Production-oriented geospatial file measurement API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "geopandas>=1.0,<2.0",
  "pyogrio>=0.10,<1.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100

autopep8 = { max_line_length = 100 }
